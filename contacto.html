<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>grido</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/contacto_style.css" />
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-primary">
        <div class="container-fluid">
          <a class="navbar-brand" href="index.html">
            <img
              src="assets/img/grido-logo.png"
              alt="grido-logo.png"
              width="80px"
            />
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="index.html"
                  >Inicio</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="productos.html">Productos</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="puntos.html">Puntos</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="contacto.html">Contacto</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <h2 id="alineamos" class="text-primary">¡Contáctanos!</h2>

      <div id="boxing">
        <h3 id="alinea" style="color: #034ea2">
          ¿Problemas con el local? ¡Ayúdanos a mejorar!
        </h3>

        <form action="#" method="post">
          <label for="floatingInput">Nombre</label>
          <div class="displays" class="form-floating mb-3">
            <input
              type="text"
              class="form-control"
              id="floatingNombre"
              placeholder="Nombre"
            />
          </div>
          <br />
          <label for="floatingPassword">Apellido</label>
          <div class="displays" class="form-floating">
            <input
              type="text"
              class="form-control"
              id="floatingApellido"
              placeholder="Apellido"
            />
          </div>
          <br />
          <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label"
              >Correo electrónico</label
            >
            <input
              type="email"
              class="form-control"
              id="exampleFormControlInput1"
              placeholder="nombre@gmail.com"
            />
          </div>

          <label for="#">Seleccione su tipo de queja</label>
          <select class="form-select" aria-label="Default select example">
            <option selected>----</option>
            <option value="1">Mal servicio</option>
            <option value="2">Algo no apto en el helado</option>
            <option value="3">Mal sabor</option>
          </select>
          <br />
          <div class="mb-3">
            <label for="quejas" class="form-label">Expresa tu queja</label>
            <textarea class="form-control" id="quejas" rows="3"></textarea>
          </div>
          <br />
          <div class="mb-3">
            <label for="pruebas" class="pruebas"
              >Selecciona los archivos correspondientes a las pruebas de tu
              queja</label
            ><br />
            <input class="pruebas" type="file" id="pruebas" multiple="" />
          </div>
          <br />
          <input class="btn btn-primary" type="submit" value="Submit" />
        </form>
      </div>
    </main>

    <footer
      class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"
    >
      <div class="col-md-4 d-flex align-items-center">
        <a
          href="/"
          class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1"
          aria-label="Bootstrap"
        >
          <svg class="bi" width="30" height="24" aria-hidden="true">
            <use xlink:href="#bootstrap"></use>
          </svg>
        </a>
        <span class="mb-3 mb-md-0 text-body-secondary">© 2026 Grido, Inc</span>
      </div>
      <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
        <li class="ms-3">
          <a class="text-body-secondary" href="#" aria-label="Instagram"
            ><svg class="bi" width="24" height="24" aria-hidden="true">
              <use xlink:href="#instagram"></use></svg
          ></a>
        </li>
        <li class="ms-3">
          <a class="text-body-secondary" href="#" aria-label="Facebook"
            ><svg class="bi" width="24" height="24">
              <use xlink:href="#facebook"></use></svg
          ></a>
        </li>
      </ul>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
